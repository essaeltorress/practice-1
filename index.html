<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Inventario de Productos</h1>
        
        <div class="content">
            <div class="sidebar">
                <h3>Filtros</h3>
                <button onclick="filtrar('Todos')">Todos</button>
                <button onclick="filtrar('Frutas')">Frutas</button>
                <button onclick="filtrar('Verduras')">Verduras</button>
                <button onclick="filtrar('Lácteos')">Lácteos</button>
                <hr>
                <button onclick="toggleTabla()" id="btnToggle">Ocultar Tabla</button>
            </div>

            <div class="main">
                <div class="formulario">
                    <h2>Agregar Producto</h2>
                    <form id="Formulario">
                        <div>
                            <label>ID Inventario</label>
                            <input type="text" id="id">
                        </div>
                        <div>
                            <label>Descripción</label>
                            <input type="text" id="descripcion">
                        </div>
                        <div>
                            <label>Departamento</label>
                            <select id="departamento">
                                <option value="">Seleccionar...</option>
                                <option value="Frutas">Frutas</option>
                                <option value="Verduras">Verduras</option>
                                <option value="Lácteos">Lácteos</option>
                            </select>
                        </div>
                        <button type="submit">Guardar Producto</button>
                    </form>
                </div>

                <div class="tabla-contenedor" id="tablaContenedor">
                    <h2>Lista de Productos</h2>
                    <table id="Tabla">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descripción</th>
                                <th>Departamento</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
